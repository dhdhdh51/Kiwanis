name: Android APK

# Builds the VidVault Android app.
#
# Signing happens on the VidVault server, NOT here: the repository is public, so the signing key never
# touches GitHub. Each build publishes an *unsigned* release APK as a GitHub pre-release; the server
# (vidvault-apk-sync timer) picks it up, signs it with its private key and serves it at /download/android.
#
# Optional: if ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
# secrets exist, the APK is signed here instead.
#
# Optional repository variable VIDVAULT_SERVER sets the default server shown at sign-in.

on:
  push:
    branches: [main, master, feature/vidvault-platform]
    paths: ['android/**', '.github/workflows/android.yml']
    tags: ['android-v*']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      server:
        description: 'Default server URL baked into the app'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      SERVER: ${{ github.event.inputs.server || vars.VIDVAULT_SERVER || 'https://vault.bharatseo.site' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            NAME="${GITHUB_REF#refs/tags/android-v}"
          else
            NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Set up signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$STORE_PW"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PW"
            } > keystore.properties
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            # Unsigned release build — signed later on the server.
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/release/app-release-unsigned.apk" >> "$GITHUB_OUTPUT"
            echo "suffix=-unsigned" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon ${{ steps.signing.outputs.task }} \
            -Pvidvault.server="$SERVER" \
            -Pvidvault.versionCode=${{ steps.version.outputs.code }} \
            -Pvidvault.versionName=${{ steps.version.outputs.name }}

      - name: Rename APK
        id: apk
        run: |
          OUT="VidVault-${{ steps.version.outputs.name }}${{ steps.signing.outputs.suffix }}.apk"
          cp "${{ steps.signing.outputs.apk }}" "$OUT"
          echo "path=android/$OUT" >> "$GITHUB_OUTPUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT"
          echo "sha256=$(sha256sum "$OUT" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Every non-PR build becomes a pre-release the server can sign; android-v* tags become full releases.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('android-build-{0}', steps.version.outputs.name) }}
          target_commitish: ${{ github.sha }}
          name: VidVault Android ${{ steps.version.outputs.name }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/android-v') }}
          files: ${{ steps.apk.outputs.path }}
          body: |
            Android build ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }}) from ${{ github.sha }}.
            Install the signed app from the VidVault website: **/download/android**.

            sha256: `${{ steps.apk.outputs.sha256 }}`

      - name: Clean up signing files
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
